name: Release

# Triggered by a version tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Version from the tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "file_version=$v.0" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: go mod tidy

      - name: Tests
        run: go test ./...

      # icon (resource #1, loaded by the app window), DPI-aware manifest, name, version and copyright:
      # cmd/paramlens/winres/winres.json
      - name: Executable resources
        shell: bash
        working-directory: cmd/paramlens
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch amd64 \
            --product-version "${{ steps.ver.outputs.file_version }}" \
            --file-version "${{ steps.ver.outputs.file_version }}"

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o dist/ParamLens.exe ./cmd/paramlens

      - name: Standalone HTML version (offline)
        shell: bash
        run: |
          go run ./cmd/paramlens -write-html dist/ParamLens.html
          grep -q 'id="pl-engine"' dist/ParamLens.html

      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist && sha256sum ParamLens.exe > ParamLens.exe.sha256 && sha256sum ParamLens.html > ParamLens.html.sha256 && cat *.sha256
          # the notes are the section of this version in CHANGELOG.md
          awk -v v="${{ steps.ver.outputs.version }}" '/^## \[/{ if (on) exit; on = index($0, "## [" v "]") == 1; next } on' ../CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ParamLens.exe
            dist/ParamLens.exe.sha256
            dist/ParamLens.html
            dist/ParamLens.html.sha256
          body_path: dist/notes.md
          generate_release_notes: true
