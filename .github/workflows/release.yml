name: Release

# Triggered by a version tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Version from the tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "file_version=$v.0" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: go mod tidy

      - name: Tests
        run: go test ./...

      - name: Executable metadata (name, version, copyright)
        shell: bash
        working-directory: cmd/paramlens
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres simply --arch amd64 --manifest cli \
            --product-name "ParamLens" \
            --file-description "ParamLens - parameter profiling for rpc_completed (SQL Server Extended Events)" \
            --product-version "${{ steps.ver.outputs.file_version }}" \
            --file-version "${{ steps.ver.outputs.file_version }}" \
            --copyright "Copyright (c) 2026 Italo Mesquita - MIT License" \
            --original-filename "ParamLens.exe"

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o dist/ParamLens.exe ./cmd/paramlens

      - name: Standalone HTML version (offline)
        shell: bash
        run: |
          go run ./cmd/paramlens -write-html dist/ParamLens.html
          grep -q 'id="pl-engine"' dist/ParamLens.html

      - name: Upload the unsigned executable
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ParamLens-unsigned
          path: dist/ParamLens.exe
          if-no-files-found: error

      # Runs only after the project is approved by the SignPath Foundation
      # (secret SIGNPATH_API_TOKEN and variable SIGNPATH_ORGANIZATION_ID configured).
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'ParamLens'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'default'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Pick the binary (signed if available)
        shell: bash
        run: |
          if [ -f signed/ParamLens.exe ]; then cp signed/ParamLens.exe dist/ParamLens.exe; echo "Using the signed binary"; fi
          cd dist && sha256sum ParamLens.exe > ParamLens.exe.sha256 && sha256sum ParamLens.html > ParamLens.html.sha256 && cat *.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ParamLens.exe
            dist/ParamLens.exe.sha256
            dist/ParamLens.html
            dist/ParamLens.html.sha256
          generate_release_notes: true
